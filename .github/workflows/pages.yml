# Workflow del repo PUBLICO de Pages (Sarebok85/kiosko-entrenos-app), no de run-ai:
# kiosko-app/publica.py lo copia alli como .github/workflows/pages.yml junto a la web.
# No construye nada: data.json llega ya generado por `node kiosko-app/build.js`.
name: kiosko

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
